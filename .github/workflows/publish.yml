name: Publish images

# Multi-arch images on GHCR for Loopback's demo profile:
#   ghcr.io/kunstefix/ledgerly-demo      (app)
#   ghcr.io/kunstefix/ledgerly-demo-db   (seeded Postgres)
# The first publish may create private packages; make them public once in the
# package settings on GitHub (see README).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: app
            image: ghcr.io/kunstefix/ledgerly-demo
          - target: db
            image: ghcr.io/kunstefix/ledgerly-demo-db
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Ledgerly demo (${{ matrix.target }}), the demo customer of Loopback
          cache-from: type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.target }}
