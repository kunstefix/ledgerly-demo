# Ledgerly on its own: http://localhost:4000
#
#   docker compose up --build
#
# Demo values only (see .env.example). To enable the support widget, put Loopback's
# settings in ./config/loopback.json (Loopback's demo-setup writes it) or set the
# LOOPBACK_* variables.

services:
  db:
    build:
      context: .
      target: db
    image: ghcr.io/kunstefix/ledgerly-demo-db:latest
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledgerly -d ledgerly']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    image: ghcr.io/kunstefix/ledgerly-demo:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgres://ledgerly:ledgerly_demo@db:5432/ledgerly
      SESSION_SECRET: ${SESSION_SECRET:-ledgerly-demo-session-secret-not-for-production}
      LOOPBACK_CONFIG_FILE: /config/loopback.json
      LOOPBACK_API_PUBLIC_URL: ${LOOPBACK_API_PUBLIC_URL:-}
      LOOPBACK_WIDGET_CONNECTION_ID: ${LOOPBACK_WIDGET_CONNECTION_ID:-}
      LOOPBACK_IDENTITY_SECRET: ${LOOPBACK_IDENTITY_SECRET:-}
      LOOPBACK_HELP_CENTER_URL: ${LOOPBACK_HELP_CENTER_URL:-}
    volumes:
      - ./config:/config:ro
